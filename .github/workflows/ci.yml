name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Linux (build-and-test) is verified: it has actually run on this repo's
# GitHub Actions. build-and-test-windows and build-and-test-macos below are
# UNVERIFIED — written and reviewed on a Linux dev host with no access to a
# Windows or macOS machine to run them against; see reports/M4 for exactly
# what was and wasn't exercised before these jobs were added, in particular
# around the Manifold native library (built from source per-platform as a
# job step — win-x64/osx-* prebuilt binaries don't exist yet, unlike
# linux-x64's, which is committed to git). Their first real run is whatever
# push/PR triggers them first.
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Meshwright.sln

      - name: Build
        run: dotnet build Meshwright.sln --configuration Release --no-restore

      # tests/corpus/files/ is fetched, never committed (see manifest.tsv and
      # AGENTS.md). Cached by manifest hash so a normal run costs nothing;
      # a manifest change invalidates the cache and re-fetches.
      - name: Cache test corpus
        id: cache-corpus
        uses: actions/cache@v4
        with:
          path: tests/corpus/files
          key: corpus-${{ hashFiles('tests/corpus/manifest.tsv') }}

      - name: Fetch test corpus
        run: scripts/fetch-corpus.sh

      # GPU tests (tests/Meshwright.Tests.Gpu) open a real GL context via
      # Silk.NET.Windowing and skip gracefully (Xunit.SkippableFact) if none
      # is available — installing Xvfb + Mesa software rendering here means
      # they actually run in CI instead of silently no-op'ing.
      - name: Install Xvfb + Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0

      - name: Test
        run: xvfb-run --auto-servernum dotnet test Meshwright.sln --configuration Release --no-build --logger "console;verbosity=normal"

  # UNVERIFIED — see the top-of-file comment. Builds Manifold's native
  # library from source on the runner itself (scripts/build-manifold-
  # native-windows.sh), since no win-x64 native binary is committed to git
  # the way linux-x64's is. Deliberately does NOT run
  # tests/Meshwright.Tests.Gpu (see SPECIFICATION.md / M4 notes — GitHub
  # runners have no GPU, and that suite was only just fixed for a
  # parallelism hang on the one platform it does run on).
  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # windows-latest ships CMake, Ninja and some Visual Studio toolchain,
      # but which VS version varies as the image is updated over time (it
      # moved from VS 2022 to VS 2026 between this job's first two runs,
      # which is what the script's generator selection now guards against -
      # see its own comments for the detail). Run under bash (Git Bash,
      # present on windows-latest) so the script itself can stay portable
      # shell rather than PowerShell.
      - name: Build Manifold native library
        shell: bash
        run: scripts/build-manifold-native-windows.sh

      - name: Restore
        run: dotnet restore Meshwright.sln

      - name: Build
        run: dotnet build Meshwright.sln --configuration Release --no-restore

      - name: Cache test corpus
        id: cache-corpus
        uses: actions/cache@v4
        with:
          path: tests/corpus/files
          key: corpus-${{ hashFiles('tests/corpus/manifest.tsv') }}

      - name: Fetch test corpus
        shell: bash
        run: scripts/fetch-corpus.sh

      - name: Test
        run: dotnet test tests/Meshwright.Tests --configuration Release --no-build --logger "console;verbosity=normal"

  # UNVERIFIED — see the top-of-file comment. macos-latest is Apple
  # Silicon, so this builds/tests osx-arm64 only; osx-x64 coverage would
  # need a separate Intel runner (not added — see reports/M4). Same GPU-
  # suite exclusion as the Windows job, for the same reason.
  build-and-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Manifold native library
        run: scripts/build-manifold-native-macos.sh

      - name: Restore
        run: dotnet restore Meshwright.sln

      - name: Build
        run: dotnet build Meshwright.sln --configuration Release --no-restore

      - name: Cache test corpus
        id: cache-corpus
        uses: actions/cache@v4
        with:
          path: tests/corpus/files
          key: corpus-${{ hashFiles('tests/corpus/manifest.tsv') }}

      - name: Fetch test corpus
        run: scripts/fetch-corpus.sh

      - name: Test
        run: dotnet test tests/Meshwright.Tests --configuration Release --no-build --logger "console;verbosity=normal"
